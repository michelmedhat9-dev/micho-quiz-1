    color:var(--parchment);
    min-height:100vh;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:24px 14px 60px;
  }
  .wrap{width:100%;max-width:460px;}
  h1,h2,h3{font-family:'Amiri',serif;margin:0;}
  .eyebrow{font-size:13px;letter-spacing:1px;color:var(--gold-bright);text-align:center;margin-bottom:6px;font-weight:600;}
  .title{font-size:26px;text-align:center;color:var(--parchment);margin-bottom:4px;}
  .subtitle{text-align:center;color:#e4dcf5;font-size:14px;margin-bottom:22px;}

  .card{
    background:linear-gradient(160deg, var(--glass-1), var(--glass-2));
    backdrop-filter:blur(6px);
    border:1px solid rgba(230,199,102,0.25);
    border-radius:26px 26px 14px 14px;
    padding:26px 20px;
    box-shadow:0 20px 45px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.06);
    position:relative;overflow:hidden;margin-bottom:16px;
  }
  .card::before{
    content:"";position:absolute;top:0;left:0;right:0;height:5px;
    background:linear-gradient(90deg, transparent, var(--gold) 20%, var(--gold-bright) 50%, var(--gold) 80%, transparent);
  }

  .btn{
    display:block;width:100%;
    background:linear-gradient(180deg, var(--gold-bright), var(--gold));
    color:#241a05;font-family:'Cairo',sans-serif;font-weight:800;font-size:16px;
    border:none;border-radius:14px;padding:14px;margin-top:10px;cursor:pointer;
    box-shadow:0 8px 18px rgba(202,162,60,0.25);
  }
  .btn:active{transform:translateY(1px) scale(0.99);}
  .btn.secondary{background:transparent;color:var(--gold-bright);border:1.5px solid rgba(230,199,102,0.5);box-shadow:none;}
  .btn.danger{background:linear-gradient(180deg,#c96b6b,var(--wrong));color:#fff3f0;}
  .btn:disabled{opacity:0.4;cursor:not-allowed;}
  .btn.small{padding:9px;font-size:13px;width:auto;flex:1;}

  input[type=text],input[type=password],textarea{
    width:100%;padding:13px;border-radius:12px;border:1.5px solid rgba(230,199,102,0.35);
    background:rgba(0,0,0,0.28);color:var(--parchment);font-family:'Cairo',sans-serif;font-size:15px;
    outline:none;margin-bottom:10px;
  }
  input:focus,textarea:focus{border-color:var(--gold-bright);}
  label{font-size:12.5px;color:var(--gold-bright);display:block;margin-bottom:4px;}

  /* home screen */
  .home-wrap{display:flex;flex-direction:column;gap:18px;margin-top:60px;}
  .role-btn{
    position:relative;height:150px;border-radius:22px;border:1px solid rgba(230,199,102,0.35);
    display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;
    box-shadow:0 16px 34px rgba(0,0,0,0.4);
  }
  .role-btn span{
    position:relative;z-index:2;font-family:'Amiri',serif;font-size:30px;font-weight:700;color:#fff;
    text-shadow:0 2px 10px rgba(0,0,0,0.7);letter-spacing:1px;
  }

  } finally {
    clearTimeout(id);
  }
}
async function getState(){
  try{
    const res = await fetchWithTimeout(`${FIREBASE_URL}/gameState.json`);
    const data = await res.json();
    return data ? data : defaultState();
  }catch(e){ console.error('getState error', e); return defaultState(); }
}
async function setState(s){
  try{
    await fetchWithTimeout(`${FIREBASE_URL}/gameState.json`, {
      method:'PUT',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(s)
    });
  }catch(e){ console.error('setState error', e); }
}
async function getQuestions(){
  try{
    const res = await fetchWithTimeout(`${FIREBASE_URL}/questions.json`);
    const data = await res.json();
    if(Array.isArray(data) && data.length>0) return data;
  }catch(e){ console.error('getQuestions error', e); }
  const seeded = buildDefaultQuestions();
  setQuestions(seeded); // fire and forget
  return seeded;
}
async function setQuestions(qs){
  try{
    await fetchWithTimeout(`${FIREBASE_URL}/questions.json`, {
      method:'PUT',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(qs)
    });
  }catch(e){ console.error('setQuestions error', e); }
}

/* ---------------- App state ---------------- */
let role = null; // 'admin' | 'player'
let playerName = null;
let pollTimer = null;
let QUESTIONS = [];
let demoState = null;
let demoTimer = null;
let qEditIndex = null; // null | 'new' | number

const app = document.getElementById('app');

/* ---------------- Home ---------------- */
function renderHome(){
  app.innerHTML = `
    <div class="home-wrap">
      <div class="role-btn" id="adminHomeBtn"><span>Admin</span></div>
      <div class="role-btn" id="playerHomeBtn"><span>Player</span></div>
    </div>
  `;
  document.getElementById('adminHomeBtn').onclick = renderAdminLogin;
  document.getElementById('playerHomeBtn').onclick = renderJoin;
}

/* ---------------- Admin login ---------------- */
function renderAdminLogin(){
  app.innerHTML = `
    <div class="eyebrow">دخول المسؤول</div>
    <div class="title">Admin</div>
    <div class="card">
      <label>كلمة المرور</label>
      <input type="password" id="pwInput" placeholder="••••••••">
      <div class="error-text" id="pwError"></div>
      <button class="btn" id="loginBtn">دخول</button>
      <div class="back-link" id="backHome">رجوع</div>

  `;
  document.getElementById('backHome').onclick = renderHome;
  document.getElementById('loginBtn').onclick = async ()=>{
    const val = document.getElementById('pwInput').value;
    if(val === ADMIN_PASSWORD){
      role='admin';
      QUESTIONS = await getQuestions();
      startPolling();
      renderAdminDashboard(await getState());
    } else {
      document.getElementById('pwError').textContent = 'كلمة المرور غير صحيحة';

/* ---------------- Player join ---------------- */
function renderJoin(){
  app.innerHTML = `
    <div class="eyebrow">دخول اللاعب</div>
    <div class="title">Player</div>
    <div class="subtitle">حد أقصى ٣ لاعبين في اللعبة الواحدة</div>
    <div class="card">
      <input type="text" id="nameInput" placeholder="اسمك" maxlength="16">
      <button class="btn" id="joinBtn">انضمام للعبة</button>
      <div class="back-link" id="backHome2">رجوع</div>
    </div>
  `;
  document.getElementById('backHome2').onclick = renderHome;
  document.getElementById('joinBtn').onclick = async ()=>{
    const val = document.getElementById('nameInput').value.trim();
    if(!val) return;
    const state = await getState();
    if(!state.players) state.players={};
    const already = val in state.players;
    if(!already && Object.keys(state.players).length>=3){
      alert('اللعبة مكتملة بالفعل بثلاثة لاعبين');
      return;
    }
    if(!already) state.players[val]=0;
    await setState(state);
    playerName = val;
    QUESTIONS = await getQuestions();
    startPolling();
    renderPlayer(state);
  };
}

/* ---------------- Shared UI helpers ---------------- */
function ringStyle(remaining, total){
  const pct = Math.max(0, Math.min(1, remaining/total));
  const deg = pct*360;
  const color = remaining<=10 ? 'var(--wrong)' : 'var(--gold-bright)';
  return `background: conic-gradient(${color} ${deg}deg, rgba(255,255,255,0.1) ${deg}deg); box-shadow:0 0 16px rgba(202,162,60,0.25);`;
}
function computeRemaining(startedAt){
  if(!startedAt) return TIMER_SECONDS;
  const elapsed = Math.floor((Date.now()-startedAt)/1000);
  return Math.max(0, TIMER_SECONDS-elapsed);
}
function renderScoreRows(players, ranked){
  if(!players || Object.keys(players).length===0) return `<div class="status-line">لا يوجد لاعبون بعد</div>`;
  let entries = Object.entries(players);
  if(ranked) entries.sort((a,b)=>b[1]-a[1]);
  return entries.map(([name,score])=>`<div class="score-row"><span class="name">${name}</span><span class="pts">${score}</span></div>`).join('');
}

/* ---------------- Player screen ---------------- */
function renderPlayer(state){
  if(!state) return;
  const myScore = state.players && (playerName in state.players) ? state.players[playerName] : 0;

  if(state.status==='lobby'){
    app.innerHTML = `
      <div class="eyebrow">أهلاً ${playerName}</div>
      <div class="title">في انتظار الأدمن</div>
      <div class="subtitle">اللعبة هتبدأ لما الأدمن يضغط "ابدأ"</div>
      <div class="card"><div class="qcat">اللاعبون المنضمّون</div>${renderScoreRows(state.players)}</div>
    `;
    return;
  }
  if(state.status==='finished'){
    app.innerHTML = `
      <div class="eyebrow">انتهت المسابقة</div>
      <div class="title">النتيجة النهائية</div>
      <div class="card"><div class="scoreboard">${renderScoreRows(state.players, true)}</div></div>
      <div class="footer-note">نقاطك: ${myScore}</div>
    `;
    return;
  }

  const q = QUESTIONS[state.questionIndex];
  if(!q){ app.innerHTML = `<div class="status-line">جارِ تحميل السؤال...</div>`; return; }
  const remaining = computeRemaining(state.questionStartedAt);

  let banner = '';
  if(state.revealAnswer){
    if(state.winner===playerName) banner = `<div class="result-banner ${state.wasCorrect?'win':'lose'}">${state.wasCorrect?'إجابة صحيحة! +١ نقطة':'إجابة خاطئة، -١ نقطة'}</div>`;
    else if(state.winner) banner = `<div class="result-banner none">أجاب ${state.winner} أولاً — السؤال مقفول</div>`;
    else banner = `<div class="result-banner none">انتهى الوقت ولم يجب أحد</div>`;
  }

  const optionsHtml = q.options.map((opt,i)=>{
    let cls='option';
    let disabled = state.locked ? 'disabled' : '';
    if(state.revealAnswer){
      if(i===q.correct) cls+=' correct';
      else if(state.winner===playerName && i===state.chosenIndex) cls+=' wrong';
    }
    return `<button class="${cls}" ${disabled} data-idx="${i}">${opt}</button>`;
  }).join('');

  app.innerHTML = `
    <div class="progress">سؤال ${state.questionIndex+1} من ${QUESTIONS.length} · نقاطك: ${myScore}</div>
    <div class="timer-row"><div class="ring" style="${ringStyle(remaining, TIMER_SECONDS)}"><div class="ring-num">${remaining}</div></div></div>
    <div class="card">
      <div class="qcat">${q.cat}</div>
      <div class="qtext">${q.q}</div>
      ${banner}
      ${optionsHtml}
    </div>
  `;

  if(!state.locked){
    app.querySelectorAll('.option').forEach(btn=>{
      btn.onclick = async ()=>{
        app.querySelectorAll('.option').forEach(b=>b.disabled=true);
        const fresh = await getState();
        if(fresh.locked){ renderPlayer(fresh); return; }
        const idx = parseInt(btn.dataset.idx,10);
        fresh.locked = true;
        fresh.winner = playerName;
        fresh.chosenIndex = idx;
        const correct = idx===q.correct;
        fresh.wasCorrect = correct;
        fresh.revealAnswer = true;
        if(!(playerName in fresh.players)) fresh.players[playerName]=0;
        fresh.players[playerName] += correct ? 1 : -1;
        await setState(fresh);
        renderPlayer(fresh);
      };
    });
  }
}

/* ---------------- Admin dashboard (lobby / live / finished) ---------------- */
function renderAdminDashboard(state){
  if(!state){ app.innerHTML = '<div class="status-line">جارِ التحميل...</div>'; return; }

  if(state.status==='lobby'){
    const count = state.players ? Object.keys(state.players).length : 0;
    app.innerHTML = `
      <div class="eyebrow">Admin</div>
      <div class="title">غرفة الانتظار</div>
      <div class="subtitle">مش شرط اكتمال الثلاثة لاعبين عشان تبدأ</div>
      <div class="card">
        <div class="qcat">اللاعبون (${count}/٣)</div>
        <div class="scoreboard">${renderScoreRows(state.players)}</div>
        <button class="btn" id="startBtn">ابدأ اللعبة</button>
      </div>
      <div class="card">
        <div class="admin-controls">
          <button class="btn secondary small" id="manageBtn">إدارة الأسئلة</button>
          <button class="btn secondary small" id="demoBtn">Demo Game</button>
        </div>
        <button class="btn danger" id="resetBtn">تصفير كل النقاط</button>
      </div>
      <div class="back-link" id="logoutBtn">تسجيل خروج</div>
    `;
    document.getElementById('startBtn').onclick = async ()=>{
      const s = await getState();
      s.status='active'; s.questionIndex=0; s.questionStartedAt=Date.now();
      s.locked=false; s.winner=null; s.wasCorrect=null; s.revealAnswer=false; s.chosenIndex=null;
      await setState(s); renderAdminDashboard(s);
    };
    document.getElementById('manageBtn').onclick = ()=>{ qEditIndex=null; renderQuestionManager(); };
    document.getElementById('demoBtn').onclick = startDemo;
    document.getElementById('resetBtn').onclick = async ()=>{
      await setState(defaultState()); renderAdminDashboard(await getState());
    };
    document.getElementById('logoutBtn').onclick = ()=>{ role=null; stopPolling(); renderHome(); };
    return;
  }

  if(state.status==='finished'){
    app.innerHTML = `
      <div class="eyebrow">Admin</div>
      <div class="title">انتهت المسابقة 🏆</div>
      <div class="card"><div class="scoreboard">${renderScoreRows(state.players, true)}</div></div>
      <button class="btn" id="newGameBtn">لعبة جديدة</button>
      <div class="back-link" id="logoutBtn2">تسجيل خروج</div>
    `;
    document.getElementById('newGameBtn').onclick = async ()=>{
      const fresh = defaultState();
      const prev = await getState();
      if(prev.players) Object.keys(prev.players).forEach(k=>fresh.players[k]=0);
      await setState(fresh); renderAdminDashboard(fresh);
    };
    document.getElementById('logoutBtn2').onclick = ()=>{ role=null; stopPolling(); renderHome(); };
    return;
  }

  const q = QUESTIONS[state.questionIndex];
  if(!q){ app.innerHTML = `<div class="status-line">جارِ تحميل السؤال...</div>`; return; }
  const remaining = computeRemaining(state.questionStartedAt);
  const isLast = state.questionIndex+1>=QUESTIONS.length;

  let banner='';
  if(state.revealAnswer){
    if(state.winner) banner = `<div class="result-banner ${state.wasCorrect?'win':'lose'}">${state.winner} أجاب ${state.wasCorrect?'إجابة صحيحة':'إجابة خاطئة'}</div>`;
    else banner = `<div class="result-banner none">انتهى الوقت بدون إجابة</div>`;
  }
  const optionsHtml = q.options.map((opt,i)=>{
    let cls='option';
    if(state.revealAnswer && i===q.correct) cls+=' correct';
    if(state.revealAnswer && state.winner && i===state.chosenIndex && !state.wasCorrect) cls+=' wrong';
    return `<div class="${cls}" style="cursor:default;">${opt}</div>`;
  }).join('');

  app.innerHTML = `
    <div class="progress">سؤال ${state.questionIndex+1} من ${QUESTIONS.length}</div>
    <div class="timer-row"><div class="ring" style="${ringStyle(remaining, TIMER_SECONDS)}"><div class="ring-num">${remaining}</div></div></div>
    <div class="card">
      <div class="qcat">${q.cat}</div>
      <div class="qtext">${q.q}</div>
      ${banner}
      ${optionsHtml}
      <div class="admin-controls" style="margin-top:16px;">
        <button class="btn" id="nextBtn">${isLast ? 'إنهاء المسابقة' : 'السؤال التالي'}</button>
      </div>
    </div>
    <div class="card"><div class="qcat">النتيجة الحالية</div><div class="scoreboard">${renderScoreRows(state.players, true)}</div></div>
    <div class="back-link" id="logoutBtn3">تسجيل خروج</div>
  `;
  document.getElementById('nextBtn').onclick = async ()=>{
    const s = await getState();
    if(s.questionIndex+1>=QUESTIONS.length){ s.status='finished'; }
    else{
      s.questionIndex+=1; s.questionStartedAt=Date.now();
      s.locked=false; s.winner=null; s.wasCorrect=null; s.revealAnswer=false; s.chosenIndex=null;
    }
    await setState(s); renderAdminDashboard(s);
  };
  document.getElementById('logoutBtn3').onclick = ()=>{ role=null; stopPolling(); renderHome(); };
}

/* ---------------- Question manager ---------------- */
function emptyDraft(){ return {cat:'', q:'', options:['','','',''], correct:0}; }

function renderQuestionManager(){
  let listHtml = QUESTIONS.map((q,idx)=>{
    if(qEditIndex===idx) return questionForm(q, idx);
    return `
      <div class="qedit-card">
        <div class="qhead"><span class="cat">${q.cat||''}</span><span>#${idx+1}</span></div>
        <div class="qbody">${q.q}</div>
        <div class="opts">${q.options.map((o,i)=> i===q.correct ? `<b>✔ ${o}</b>` : o).join('<br>')}</div>
        <div class="row-btns">
          <button class="btn secondary small" data-edit="${idx}">تعديل</button>
          <button class="btn danger small" data-del="${idx}">حذف</button>
        </div>
      </div>
    `;
  }).join('');

  let addHtml = qEditIndex==='new' ? questionForm(emptyDraft(), 'new') : `<button class="btn" id="addNewBtn">+ إضافة سؤال جديد</button>`;

  app.innerHTML = `
    <div class="eyebrow">Admin</div>
    <div class="title">إدارة الأسئلة</div>
    <div class="subtitle">${QUESTIONS.length} سؤال — كلها اختيار من متعدد</div>
    ${listHtml}
    <div class="card">${addHtml}</div>
    <div class="back-link" id="backDash">رجوع للوحة التحكم</div>
  `;

  document.getElementById('backDash').onclick = async ()=>{ qEditIndex=null; renderAdminDashboard(await getState()); };
  const addBtn = document.getElementById('addNewBtn');
  if(addBtn) addBtn.onclick = ()=>{ qEditIndex='new'; renderQuestionManager(); };

  app.querySelectorAll('[data-edit]').forEach(b=>{
    b.onclick = ()=>{ qEditIndex = parseInt(b.dataset.edit,10); renderQuestionManager(); };
  });
  app.querySelectorAll('[data-del]').forEach(b=>{
    b.onclick = async ()=>{
      const idx = parseInt(b.dataset.del,10);
      if(!confirm('تأكيد حذف هذا السؤال؟')) return;
      QUESTIONS.splice(idx,1);
      await setQuestions(QUESTIONS);
      qEditIndex=null;
      renderQuestionManager();
    };
  });

  wireQuestionForm();
}

function questionForm(q, key){
  return `
    <div class="qedit-card" id="formCard-${key}">
      <label>الفئة</label>
      <input type="text" id="f-cat-${key}" value="${(q.cat||'').replace(/"/g,'&quot;')}" placeholder="مثال: العهد الجديد">
      <label>نص السؤال</label>
      <textarea id="f-q-${key}" rows="2">${q.q||''}</textarea>
      <label>الاختيارات (٤)</label>
      ${[0,1,2,3].map(i=>`<input type="text" id="f-opt-${key}-${i}" value="${(q.options[i]||'').replace(/"/g,'&quot;')}" placeholder="اختيار ${i+1}">`).join('')}
      <label>الإجابة الصحيحة</label>
      <div class="correct-pick">
        ${[0,1,2,3].map(i=>`<label><input type="radio" name="correct-${key}" value="${i}" ${q.correct===i?'checked':''}> اختيار ${i+1}</label>`).join('')}
      </div>
      <div class="row-btns">
        <button class="btn small" id="save-${key}">حفظ</button>
        <button class="btn secondary small" id="cancel-${key}">إلغاء</button>
      </div>
    </div>
  `;
}

function wireQuestionForm(){
  if(qEditIndex===null) return;
  const key = qEditIndex;
  const saveBtn = document.getElementById(`save-${key}`);
  const cancelBtn = document.getElementById(`cancel-${key}`);
  if(cancelBtn) cancelBtn.onclick = ()=>{ qEditIndex=null; renderQuestionManager(); };
  if(saveBtn) saveBtn.onclick = async ()=>{
    const cat = document.getElementById(`f-cat-${key}`).value.trim() || 'عام';
    const qtext = document.getElementById(`f-q-${key}`).value.trim();
    const opts = [0,1,2,3].map(i=> document.getElementById(`f-opt-${key}-${i}`).value.trim());
    const correctRadio = document.querySelector(`input[name="correct-${key}"]:checked`);
    if(!qtext || opts.some(o=>!o) || !correctRadio){
      alert('من فضلك املأ نص السؤال والاختيارات الأربعة واختر الإجابة الصحيحة');
      return;
    }
    const newQ = {cat, q:qtext, options:opts, correct: parseInt(correctRadio.value,10)};
    if(key==='new') QUESTIONS.push(newQ);
    else QUESTIONS[key] = newQ;
    await setQuestions(QUESTIONS);
    qEditIndex=null;
    renderQuestionManager();
  };
}

/* ---------------- Demo game (admin solo, local only) ---------------- */
function startDemo(){
  if(!QUESTIONS || QUESTIONS.length===0){ alert('لا توجد أسئلة'); return; }
  stopPolling();
  demoState = {index:0, score:0, startedAt:Date.now(), locked:false, revealAnswer:false, chosenIndex:null, wasCorrect:null};
  renderDemo();
  demoTimer = setInterval(()=>{
    if(!demoState || demoState.locked) return;
    const remaining = computeRemaining(demoState.startedAt);
    if(remaining<=0){ demoState.locked=true; demoState.revealAnswer=true; demoState.wasCorrect=null; demoState.chosenIndex=null; }
    renderDemo();
  }, 1000);
}
function renderDemo(){
  if(!demoState){ return; }
  if(demoState.index >= QUESTIONS.length){ renderDemoFinished(); return; }
  const q = QUESTIONS[demoState.index];
  const remaining = computeRemaining(demoState.startedAt);
  let banner='';
  if(demoState.revealAnswer){
    if(demoState.chosenIndex!==null) banner = `<div class="result-banner ${demoState.wasCorrect?'win':'lose'}">${demoState.wasCorrect?'إجابة صحيحة! +١':'إجابة خاطئة، -١'}</div>`;
    else banner = `<div class="result-banner none">انتهى الوقت</div>`;
  }
  const optionsHtml = q.options.map((opt,i)=>{
    let cls='option'; const disabled = demoState.locked ? 'disabled' : '';
    if(demoState.revealAnswer){
      if(i===q.correct) cls+=' correct';
      else if(i===demoState.chosenIndex) cls+=' wrong';
    }
    return `<button class="${cls}" ${disabled} data-idx="${i}">${opt}</button>`;
  }).join('');

  app.innerHTML = `
    <div class="eyebrow">Demo Game — تجربة فردية</div>
    <div class="progress">سؤال ${demoState.index+1} من ${QUESTIONS.length} · نقاطك: ${demoState.score}</div>
    <div class="timer-row"><div class="ring" style="${ringStyle(remaining, TIMER_SECONDS)}"><div class="ring-num">${remaining}</div></div></div>
    <div class="card">
      <div class="qcat">${q.cat}</div>
      <div class="qtext">${q.q}</div>
      ${banner}
      ${optionsHtml}
      ${demoState.locked ? `<button class="btn" id="demoNextBtn">${demoState.index+1>=QUESTIONS.length?'إنهاء':'التالي'}</button>` : ''}
    </div>
    <div class="back-link" id="exitDemoBtn">إنهاء التجربة والرجوع</div>
  `;
  if(!demoState.locked){
    app.querySelectorAll('.option').forEach(btn=>{
      btn.onclick = ()=>{
        if(demoState.locked) return;
        const idx = parseInt(btn.dataset.idx,10);
        demoState.locked=true; demoState.revealAnswer=true; demoState.chosenIndex=idx;
        demoState.wasCorrect = idx===q.correct;
        demoState.score += demoState.wasCorrect?1:-1;
        renderDemo();
      };
    });
  }
  const nextBtn = document.getElementById('demoNextBtn');
  if(nextBtn) nextBtn.onclick = ()=>{
    demoState.index+=1; demoState.startedAt=Date.now(); demoState.locked=false;
    demoState.revealAnswer=false; demoState.chosenIndex=null; demoState.wasCorrect=null;
    renderDemo();
  };
  document.getElementById('exitDemoBtn').onclick = exitDemo;
}
function renderDemoFinished(){
  app.innerHTML = `
    <div class="eyebrow">Demo Game</div>
    <div class="title">انتهت التجربة</div>
    <div class="card"><div class="qcat">نقاطك في التجربة</div><div class="scoreboard"><div class="score-row"><span class="name">أنت</span><span class="pts">${demoState.score}</span></div></div></div>
    <button class="btn" id="exitDemoBtn2">رجوع للوحة التحكم</button>
  `;
  document.getElementById('exitDemoBtn2').onclick = exitDemo;
}
function exitDemo(){
  if(demoTimer){ clearInterval(demoTimer); demoTimer=null; }
  demoState = null;
  startPolling();
  (async()=>{ renderAdminDashboard(await getState()); })();
}

/* ---------------- Polling loop ---------------- */
function startPolling(){
  if(pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(async ()=>{
    if(demoState) return; // demo mode manages its own render loop
    QUESTIONS = await getQuestions();
    const state = await getState();
    if(role==='admin' && state.status==='active' && !state.locked && state.questionStartedAt){
      const remaining = computeRemaining(state.questionStartedAt);
      if(remaining<=0){
        state.locked=true; state.revealAnswer=true; state.winner=null; state.wasCorrect=null;
        await setState(state);
      }
    }
    if(role==='admin'){
      // don't re-render over the question manager while admin is editing
      if(qEditIndex===null) renderAdminDashboard(state);
    } else if(role==='player'){
      renderPlayer(state);
    }
  }, 1000);
}
function stopPolling(){ if(pollTimer){ clearInterval(pollTimer); pollTimer=null; } }

renderHome();
getQuestions().then(qs=>{ QUESTIONS = qs; }).catch(()=>{});
</script>
